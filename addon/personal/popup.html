<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="ui/theme.css" />
        <style>
            body {
                width: 340px;
            }
            header {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 12px 12px 12px 16px;
                border-bottom: 1px solid var(--gray-200);
            }
            header h1 {
                font-size: 14px;
                font-weight: 600;
                margin: 0;
                flex: 1;
                letter-spacing: -0.01em;
            }
            section {
                padding: 16px;
                border-bottom: 1px solid var(--gray-200);
            }
            .site-row {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .site-row .text {
                flex: 1;
                min-width: 0;
            }
            .site {
                font-weight: 500;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .label {
                font-size: 12px;
                font-weight: 500;
                color: var(--gray-900);
                margin: 0 0 8px;
            }
            .hint {
                font-size: 12px;
                color: var(--gray-900);
                margin: 8px 0 0;
                min-height: 18px;
            }
            .status {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                font-size: 13px;
            }
            .status .detail {
                color: var(--gray-900);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .actions {
                display: flex;
                gap: 8px;
                margin-top: 12px;
            }
            .actions .btn {
                flex: 1;
            }
            footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 12px 10px 16px;
                font-size: 12px;
                color: var(--gray-900);
                background: var(--bg-100);
            }
            body.inactive .site-only {
                opacity: 0.45;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="kbd-logo" aria-hidden="true">
                <svg
                    width="13"
                    height="13"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M20 6 9 17l-5-5" />
                </svg>
            </div>
            <h1>Autoconsent</h1>
            <button class="btn btn-ghost icon-btn" id="open-settings" title="Settings" aria-label="Open settings">
                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path
                        d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                    />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </header>

        <section>
            <div class="site-row">
                <div class="text">
                    <div class="site" id="site">—</div>
                    <div class="subtle" style="font-size: 12px" id="site-state">Loading…</div>
                </div>
                <label class="switch" title="Run on this site">
                    <input type="checkbox" id="enabled" aria-label="Run on this site" />
                    <span class="track"></span>
                </label>
            </div>
        </section>

        <section>
            <p class="label">When a cookie banner appears</p>
            <div class="segmented" role="radiogroup" aria-label="Mode">
                <label><input type="radio" name="mode" value="optOut" /><span>Reject</span></label>
                <label><input type="radio" name="mode" value="optIn" /><span>Accept</span></label>
                <label><input type="radio" name="mode" value="null" /><span>Ask</span></label>
            </div>
            <p class="hint" id="mode-hint"></p>
        </section>

        <section class="site-only">
            <div class="status">
                <span class="detail" id="status-detail">No cookie banner handled on this page yet</span>
                <span id="status-badge"></span>
            </div>
            <div class="actions hidden" id="manual-actions">
                <button class="btn btn-primary" id="manual-reject">Reject this banner</button>
            </div>
        </section>

        <footer>
            <span id="total">—</span>
            <a href="#" id="open-activity">View activity →</a>
        </footer>

        <script src="popup.bundle.js"></script>
    </body>
</html>
